[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmsaify-trading"
version = "0.1.0"
description = "Polymarket trading engine: decision → signal → context → execution → feedback"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "OpenMSAify Team"},
]
keywords = ["polymarket", "trading", "crypto", "prediction-markets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/openmsaify/trading"
Repository = "https://github.com/openmsaify/trading"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading*"]

[tool.setuptools.package-data]
trading = ["py.typed"]
